# OpenHandsNET enterprise deps: PostgreSQL + Keycloak (OIDC broker) + LiteLLM
# (gateway de LLM opcional). Uso:
#   docker compose -f docker-compose.yaml -f docker-compose.enterprise.yaml up -d --build
# Keycloak admin: http://localhost:8081 (admin/admin — troque via KEYCLOAK_ADMIN_PASSWORD).
services:
  app:
    environment:
      - OPENHANDSNET_Database__Provider=PostgreSql
      - OPENHANDSNET_Database__ConnectionString=Host=postgres;Database=openhandsnet;Username=openhandsnet;Password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      - OPENHANDSNET_DeploymentMode=self_hosted
      - OPENHANDSNET_Auth__Provider=oidc
      - OPENHANDSNET_Auth__Authority=http://keycloak:8080/realms/openhandsnet
      - OPENHANDSNET_AgentLlm__BaseUrl=http://litellm:4000
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    container_name: openhandsnet-postgres
    environment:
      - POSTGRES_DB=openhandsnet
      - POSTGRES_USER=openhandsnet
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - openhandsnet-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openhandsnet -d openhandsnet"]
      interval: 10s
      timeout: 5s
      retries: 6
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: openhandsnet-keycloak
    command: start-dev
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD:?set KEYCLOAK_ADMIN_PASSWORD}
      - KC_HTTP_PORT=8080
      - KC_HOSTNAME_STRICT=false
    ports:
      - "8081:8080"
    volumes:
      - openhandsnet-keycloak:/opt/keycloak/data
    restart: unless-stopped

  litellm:
    image: ghcr.io/berriai/litellm:main-v1.55.8
    container_name: openhandsnet-litellm
    command: ["--config", "/etc/litellm/config.yaml", "--port", "4000"]
    volumes:
      - ./deploy/litellm.yaml:/etc/litellm/config.yaml:ro
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    ports:
      - "4000:4000"
    restart: unless-stopped

volumes:
  openhandsnet-pgdata:
  openhandsnet-keycloak:
