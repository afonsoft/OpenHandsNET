global:
  scrape_interval: 15s

scrape_configs:
  # Métricas diretas do app (prometheus-net /metrics).
  - job_name: openhandsnet
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8080"]

  # Métricas exportadas pelo OTel collector (traces→metrics OTel).
  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]
