# SonarQube/SonarCloud scanner config (SPEC-66 + gap-analysis 2026-10-22).
# NOTA (SPEC-96): dotnet-sonarscanner IGNORA este arquivo — a lista
# canônica de exclusões abaixo é espelhada via /d:sonar.exclusions
# no job `sonarcloud` de .github/workflows/ci.yml. Manter as duas em sync.
# Exclusions: vendor/generated nunca devem ser analisados — ruído não
# corrigível (monaco/xterm, runtime-architecture.html gerado, app.css).
sonar.projectKey=afonsoft_OpenHandsNET
sonar.organization=afonsoft
sonar.sourceEncoding=UTF-8

sonar.sources=src,cli,runtime,charts,scripts,tests,.github
sonar.exclusions=\
  **/wwwroot/lib/**,\
  **/wwwroot/css/app.css,\
  **/wwwroot/js/theme.js,\
  **/wwwroot/js/monacoInterop.js,\
  **/wwwroot/index.html,\
  **/Persistence/Migrations/**,\
  **/Persistence/Migrations/Postgres/**,\
  **/obj/**,\
  **/bin/**,\
  **/packages.lock.json,\
  **/Golden/**,\
  **/docs/**,\
  **/data/**

sonar.test.inclusions=**/tests/**/*Tests.cs
sonar.cs.roslyn.ignoreIssues=false
sonar.verbose=false