name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  build-test:
    name: build + test
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: setup dotnet 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.x"

      - name: nuget cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/packages.lock.json', 'Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: restore
        run: dotnet restore OpenHandsNET.slnx

      - name: lint (dotnet format)
        run: dotnet format OpenHandsNET.slnx --verify-no-changes

      - name: build (Release)
        run: dotnet build OpenHandsNET.slnx -c Release --no-restore

      - name: unit + client tests
        run: dotnet test tests/OpenHandsNET.UnitTests -c Release --no-build &&
             dotnet test tests/OpenHandsNET.Client.Tests -c Release --no-build

      - name: integration tests (docker available on ubuntu-latest)
        run: dotnet test tests/OpenHandsNET.IntegrationTests -c Release --no-build

      - name: env drift check
        run: ./scripts/check-env-drift.sh

  contracts:
    name: event contract (golden fixtures)
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: setup dotnet 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.x"

      - name: golden event fixtures
        run: dotnet test tests/OpenHandsNET.UnitTests -c Release --filter "FullyQualifiedName~Golden"

  docker:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: setup buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: build image
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: .
          push: false
          tags: openhandsnet:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: compose config check
        run: |
          docker compose -f docker-compose.yaml config -q
          POSTGRES_PASSWORD=ci KEYCLOAK_ADMIN_PASSWORD=ci \
            docker compose -f docker-compose.yaml \
            -f docker-compose.postgres.yaml config -q

  sonarcloud:
    name: sonarcloud analysis
    runs-on: ubuntu-latest
    # Ativar criando o repo variable SONAR_ENABLED=true e o secret SONAR_TOKEN
    # (SonarCloud org afonsoft, projeto afonsoft_OpenHandsNET).
    if: vars.SONAR_ENABLED == 'true'
    steps:
      - name: checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - name: setup java 17 (sonar scanner)
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: setup dotnet 10
        uses: actions/setup-dotnet@d4c94342e560b34958eacfc5d055d21461ed1c5d # v5.0.0
        with:
          dotnet-version: "10.0.x"

      - name: install sonar scanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: sonar begin
        run: >
          dotnet-sonarscanner begin
          /k:"afonsoft_OpenHandsNET" /o:"afonsoft"
          /d:sonar.host.url="https://sonarcloud.io"
          /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
          /d:sonar.exclusions="**/wwwroot/lib/**,**/bin/**,**/obj/**"

      - name: build (Release)
        run: dotnet build OpenHandsNET.slnx -c Release

      - name: sonar end
        run: dotnet-sonarscanner end /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
