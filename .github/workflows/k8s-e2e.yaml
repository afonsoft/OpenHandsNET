# SPEC-49 RF-004: e2e Kubernetes — manual/nightly apenas (custo de
# cluster). NÃO roda em PRs. kind + sysbox + helm lint/template + smoke.
name: k8s-e2e

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"   # nightly 04:00 UTC

permissions:
  contents: read

concurrency:
  group: k8s-e2e-${{ github.ref }}
  cancel-in-progress: false

jobs:
  k8s-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup dotnet
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "10.0.x"   # pinned: WASM lockfiles capture SDK-band implicit package versions — bump with lockfile regen

      - name: helm lint + template
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - run: |
          helm lint charts/sandcastle
          helm template sc charts/sandcastle \
            --set ingress.enabled=false > /tmp/rendered.yaml
          grep -q "kind: HorizontalPodAutoscaler" /tmp/rendered.yaml
          grep -q "kind: Ingress" /tmp/rendered.yaml || true
          echo "rendered $(grep -c '^kind:' /tmp/rendered.yaml) objects"
          ! grep -iE "password|secret|sk-" /tmp/rendered.yaml | \
            grep -v "secretKeyRef\|secretName\|existingSecret" || \
            echo "no plaintext secrets"

      - name: create kind cluster
        uses: helm/kind-action@ea822c7bf1874f08e5a491df991c228edffc3376 # v1.15.2
        with:
          # SPEC-81: o action default é "chart-testing"; os steps abaixo
          # (`kind load docker-image`) assumem "kind".
          cluster_name: kind

      - name: install sysbox
        run: |
          kubectl apply -f https://raw.githubusercontent.com/nestybox/sysbox/master/sysbox-k8s-manifests/sysbox-install.yaml
          kubectl -n kube-system rollout status ds/sysbox-deploy-k8s \
            --timeout=300s

      - name: build + load api image
        run: |
          docker build -t sandcastle:e2e .
          kind load docker-image sandcastle:e2e

      - name: helm install + smoke
        run: |
          helm install sc charts/sandcastle -n sc \
            --create-namespace \
            --set image.tag=e2e --set image.pullPolicy=Never \
            --set ingress.enabled=false \
            --set sandbox.provider=kubernetes
          kubectl -n sc rollout status deploy/sandcastle-api \
            --timeout=240s
          kubectl -n sc port-forward svc/sandcastle-api 8080:8080 &
          sleep 5
          curl -sf --retry 10 --retry-delay 5 \
            http://localhost:8080/api/v1/ready

      - name: diagnostics on failure
        if: failure()
        run: |
          kubectl get pods -n sc -o wide || true
          kubectl -n sc describe deploy/sandcastle-api || true
          for p in $(kubectl -n sc get pods -o name 2>/dev/null); do
            echo "=== $p ==="
            kubectl -n sc describe "$p" | tail -30 || true
            kubectl -n sc logs "$p" --all-containers --tail=80 || true
          done
          kubectl get events -n sc --sort-by=.lastTimestamp 2>/dev/null | \
            tail -20 || true
