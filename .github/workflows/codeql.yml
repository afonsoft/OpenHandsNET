name: codeql

# C# analysis on a public repo — free. If the repo ever goes private this needs
# a GHAS license; flip the triggers to workflow_dispatch-only until then.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 3"   # Wednesday 05:17 UTC — weekly rule-set refresh
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze:
    name: analyze (csharp)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup dotnet 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.112"   # pinned: WASM lockfiles capture SDK-band implicit package versions — bump with lockfile regen

      - name: codeql init
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: csharp
          queries: security-extended
          build-mode: manual

      - name: build (Release)
        run: dotnet build OpenHandsNET.slnx -c Release

      - name: codeql analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:csharp"
