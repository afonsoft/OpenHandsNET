name: cleanup-artifacts

# Workflow artifacts accrue silently — coverage merges, SARIF, mutation
# reports. Deletes anything older than 30 days, daily.
on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:

permissions:
  actions: write

concurrency:
  group: cleanup-artifacts
  cancel-in-progress: false

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: delete artifacts older than 30 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cutoff=$(date -u -d '30 days ago' +%s)
          page=1; deleted=0
          while :; do
            items=$(gh api "repos/$GH_REPO/actions/artifacts?per_page=100&page=$page" \
              --jq '.artifacts[] | select(.expired == false) | [.id, .created_at] | @tsv')
            [ -z "$items" ] && break
            while IFS=$'\t' read -r id created; do
              ts=$(date -u -d "$created" +%s)
              if [ "$ts" -lt "$cutoff" ]; then
                gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id" && deleted=$((deleted + 1))
              fi
            done <<< "$items"
            page=$((page + 1))
          done
          echo "deleted $deleted artifact(s) older than 30d" >> "$GITHUB_STEP_SUMMARY"
