name: nightly-quality

# Exotic gates that are too expensive for every PR — mutation testing and live
# OpenAPI fuzzing. Advisory-by-design for now (OmniRoute convention: a gate is
# born advisory and is promoted to blocking once it proves stable), EXCEPT the
# issue-on-failure job, which is the alerting half of the contract.
on:
  schedule:
    - cron: "41 3 * * *"   # 03:41 UTC, off-peak, distinct from other nightlies
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  stryker:
    name: Stryker.NET mutation (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup dotnet 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.112"   # pinned: WASM lockfiles capture SDK-band implicit package versions — bump with lockfile regen

      - name: install stryker
        run: dotnet tool install --global dotnet-stryker

      - name: restore + build test project
        run: |
          dotnet restore OpenHandsNET.slnx --locked-mode
          dotnet build tests/OpenHandsNET.UnitTests -c Release --no-restore

      # Advisory: mutation testing is expensive and flaky on edge cases. The
      # report still lands as an artifact so mutation-score regressions can be
      # trended; promote to blocking after a few stable weeks.
      - name: run stryker (advisory)
        continue-on-error: true
        working-directory: tests/OpenHandsNET.UnitTests
        run: dotnet stryker --reporter html --reporter json --reporter markdown

      - name: upload mutation report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stryker-report
          path: tests/OpenHandsNET.UnitTests/StrykerOutput/
          if-no-files-found: warn
          retention-days: 14

  schemathesis:
    name: OpenAPI fuzz (schemathesis)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PORT: "18080"
    steps:
      - name: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: setup dotnet 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: "10.0.112"   # pinned: WASM lockfiles capture SDK-band implicit package versions — bump with lockfile regen

      - name: build api
        run: dotnet build src/OpenHandsNET.Api -c Release

      # SPEC-97: Auth:Provider=none explícito — appsettings.json não é lido
      # quando o dll roda a partir de outro cwd, e o dev-login (que gera o
      # cookie do fuzz abaixo) só existe nesse provider.
      - name: start api (isolated data dir)
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          DATA_DIR="$RUNNER_TEMP/data" OPENHANDSNET_Auth__Provider=none \
            ASPNETCORE_URLS="http://localhost:$PORT" \
            dotnet src/OpenHandsNET.Api/bin/Release/net10.0/OpenHandsNET.Api.dll \
            > server.log 2>&1 &
          echo $! > server.pid
          for _ in $(seq 1 60); do
            if curl -sf "http://localhost:$PORT/api/v1/ready" >/dev/null; then echo "api up"; exit 0; fi
            sleep 2
          done
          echo "::error::API did not become ready in 120s — see server.log"
          tail -60 server.log || true
          exit 1

      # Remove POST /api/v1/sandboxes before fuzzing: it provisions real
      # infra (image pull + container create) and exceeds the default 10s
      # request timeout — a network error (exit 1) with all checks passing,
      # not a contract violation. Real provisioning is covered by k8s-e2e
      # and the Docker-backed integration tests. jq is preinstalled on
      # ubuntu-latest; --exclude-by can't match method+path together.
      - name: fetch openapi document
        run: |
          curl -sf "http://localhost:$PORT/openapi/v1.json" \
            | jq 'del(.paths["/api/v1/sandboxes"].post)' > /tmp/openapi.json
          head -c 300 /tmp/openapi.json

      # SPEC-97/112: FallbackPolicy exige sessão — dev-login emite o cookie
      # que minta uma API key `sk-*`; o fuzz envia `Authorization: Bearer`
      # para que o check `ignored_auth` exercite credencial inválida de
      # verdade (com cookie válido presente, mutar Authorization nunca
      # produzia 401 — falso-positivo sistêmico).
      - name: dev-login + mint sk- key (fuzz auth)
        run: |
          COOKIE_JAR=$(mktemp)
          curl -sf -c "$COOKIE_JAR" -X POST \
            "http://localhost:$PORT/api/v1/auth/dev-login" \
            -H 'content-type: application/json' \
            -d '{"email":"fuzz@local","displayName":"fuzz"}' > /dev/null
          KEY=$(curl -sf -b "$COOKIE_JAR" -X POST \
            "http://localhost:$PORT/api/v1/keys" \
            -H 'content-type: application/json' \
            -d '{"name":"nightly-fuzz"}' | jq -r '.key')
          if [ -z "$KEY" ] || [ "$KEY" = "null" ]; then
            echo "::error::mint sk- falhou"
            exit 1
          fi
          echo "FUZZ_AUTH=Authorization: Bearer $KEY" >> "$GITHUB_ENV"

      # pipx is preinstalled on ubuntu-latest and sidesteps the runner's
      # PEP-668 externally-managed Python (plain `pip install --user` fails).
      - name: install schemathesis
        run: pipx install "schemathesis==4.3.8" && echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Contract fuzz: schema-violating requests must not produce 5xx and
      # schema-conforming requests must not be rejected. Fails loudly — this is
      # a nightly, not a PR gate, so a red run pages via issue-on-failure.
      # SPEC-80: --phases sem `coverage` (4.3.8 crasha: TypeError unhashable
      # 'list') e sem `stateful` (requer links OpenAPI que não declaramos);
      # --exclude-path no SSE stream-start (não adequado a fuzz);
      # --exclude-checks:
      #   - unsupported_method: a API responde 404 — não 405 — para método
      #     errado em rota conhecida (decisão registrada na SPEC-80);
      #   - ignored_auth, not_a_server_error: corrigidos na SPEC-97 —
      #     voltaram a rodar (default-deny FallbackPolicy + fixes 4xx/500).
      #   - positive_data_acceptance, status_code_conformance,
      #     negative_data_rejection: fidelity debt (schemas frouxos →
      #     400/404 não documentados) — ainda rastreado na issue #218.
      # --warnings off: o warning `validation_mismatch` (schemas frouxos →
      #   maioria dos payloads gerados leva 400) falha o run como `1 failed`
      #   mesmo com checks verdes — mesma dívida da issue #218.
      - name: schemathesis run (blocking)
        run: |
          schemathesis run /tmp/openapi.json --url "http://localhost:$PORT" \
            -H "$FUZZ_AUTH" \
            --max-examples 15 --workers 2 --checks all \
            --phases examples,fuzzing \
            --exclude-path /api/v1/app-conversations/stream-start \
            --exclude-checks unsupported_method,positive_data_acceptance,status_code_conformance,negative_data_rejection \
            --warnings off \
            --suppress-health-check all --no-color

      - name: stop api + upload logs
        if: always()
        run: |
          kill "$(cat server.pid)" 2>/dev/null || true
          tail -100 server.log >> "$GITHUB_STEP_SUMMARY" || true

      - name: upload server log
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: schemathesis-server-log
          path: server.log
          if-no-files-found: ignore
          retention-days: 7

  # Opens/updates a tracking issue when any nightly gate fails; closes the loop
  # by commenting when the branch goes green again (OmniRoute release-green
  # pattern, simplified).
  issue-on-failure:
    name: alert on nightly failure
    if: ${{ always() && github.event_name == 'schedule' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [stryker, schemathesis]
    permissions:
      issues: write
      contents: read
    steps:
      - name: evaluate results
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          FAILED=$(printf '%s' "$NEEDS_JSON" \
            | jq -r 'to_entries | map(select(.value.result != "success" and .value.result != "skipped")) | .[].key' \
            | paste -sd", " -)
          echo "failed=$FAILED" >> "$GITHUB_ENV"
          [ -z "$FAILED" ]

      - name: ensure label exists
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create nightly-red --repo "${{ github.repository }}" \
            --color B60205 --description "Nightly quality gate failure" \
            2>/dev/null || true

      - name: open tracking issue
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const needs = ${{ toJSON(needs) }};
            const failed = Object.entries(needs)
              .filter(([, v]) => v.result !== "success" && v.result !== "skipped")
              .map(([k]) => k);
            if (failed.length === 0) return;
            const { owner, repo } = context.repo;
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            const title = "nightly-quality failure: " + failed.join(", ");
            const existing = (await github.rest.issues.listForRepo({
              owner, repo, state: "open", labels: "nightly-red", per_page: 10,
            })).data[0];
            const body = [
              "Nightly quality gate failed on `" + context.refName + "`.",
              "",
              "Failed jobs: " + failed.map((f) => "`" + f + "`").join(", "),
              "",
              "Run: " + runUrl,
            ].join("\n");
            if (existing) {
              await github.rest.issues.createComment({ owner, repo, issue_number: existing.number, body });
            } else {
              await github.rest.issues.create({ owner, repo, title, body, labels: ["nightly-red"] });
            }
