version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    groups:
      production:
        dependency-type: "production"
        update-types: ["minor", "patch"]
      test-sdk:
        patterns: ["xunit*", "Shouldly", "Testcontainers*", "coverlet*", "bunit", "Microsoft.NET.Test.Sdk"]
        update-types: ["minor", "patch"]
      efcore:
        patterns: ["Microsoft.EntityFrameworkCore*", "Npgsql.EntityFrameworkCore*", "EFCore.*"]
        update-types: ["minor", "patch"]
      aspnet:
        patterns: ["Microsoft.AspNetCore*", "Microsoft.Extensions*"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    commit-message:
      prefix: "deps"
    open-pull-requests-limit: 10
    groups:
      actions:
        update-types: ["minor", "patch"]
