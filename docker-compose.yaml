# OpenHandsNET — OSS single-container (enterprise profile com PG/Keycloak: SPEC-13)
services:
  app:
    build: .
    image: openhandsnet:latest
    container_name: openhandsnet
    env_file:
      - path: .env
        required: false
    environment:
      - OPENHANDSNET_Database__ConnectionString=Data Source=/app/data/openhandsnet.db
    ports:
      - "${OPENHANDSNET_PORT:-3032}:8080"
    volumes:
      - openhandsnet-data:/app/data
      - openhandsnet-workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  openhandsnet-data:
  openhandsnet-workspace:
