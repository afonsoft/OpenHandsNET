# Sandcastle — OSS single-container (enterprise profile com PG/Keycloak: SPEC-13)
services:
  app:
    build: .
    image: sandcastle:latest
    container_name: sandcastle
    env_file:
      - path: .env
        required: false
    environment:
      - SANDCASTLE_Database__ConnectionString=Data Source=/app/data/sandcastle.db
    ports:
      - "${SANDCASTLE_PORT:-3032}:8080"
    volumes:
      - sandcastle-data:/app/data
      - sandcastle-workspace:/workspace
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  sandcastle-data:
  sandcastle-workspace:
