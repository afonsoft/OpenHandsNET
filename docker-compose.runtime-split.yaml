# SPEC-35: split deployment — `docker compose -f docker-compose.yaml
# -f docker-compose.runtime-split.yaml up`.
# O engine (docker + warm pool) roda em `runtime-api`; o app delega via
# HTTP interno autenticado por X-Runtime-Key (Sandbox:Provider=remote).
# Workspace: o daemon resolve binds no HOST — monte o mesmo path absoluto
# dentro do runtime-api (SANDCASTLE_WORKSPACE_HOST).
services:
  app:
    environment:
      - SANDCASTLE_Sandbox__Provider=remote
      - SANDCASTLE_Sandbox__RemoteBaseUrl=http://runtime-api:8081
      - SANDCASTLE_Sandbox__RemoteApiKey=${SANDCASTLE_RUNTIME_KEY:?set SANDCASTLE_RUNTIME_KEY}
      - SANDCASTLE_Sandbox__ControlNetwork=sandcastle-control
    networks:
      - default
      - control
    depends_on:
      runtime-api:
        condition: service_healthy
    # Sem socket docker: o app não toca o daemon em modo remoto.

  runtime-api:
    build:
      context: .
      dockerfile: Dockerfile.runtime-api
    image: sandcastle-runtime-api:latest
    container_name: sandcastle-runtime-api
    environment:
      - SANDCASTLE_Sandbox__RemoteApiKey=${SANDCASTLE_RUNTIME_KEY:?set SANDCASTLE_RUNTIME_KEY}
      - SANDCASTLE_Sandbox__ControlNetwork=sandcastle-control
      - SANDCASTLE_Sandbox__WorkspaceRoot=${SANDCASTLE_WORKSPACE_HOST:-/tmp/sc-workspaces}
      - SANDCASTLE_Sandbox__WarmPoolSize=${SANDCASTLE_WARM_POOL_SIZE:-0}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # Mesmo path absoluto dentro do container e no host — o daemon
      # interpreta binds como paths do host.
      - ${SANDCASTLE_WORKSPACE_HOST:-/tmp/sc-workspaces}:${SANDCASTLE_WORKSPACE_HOST:-/tmp/sc-workspaces}
    networks:
      - control
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8081/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    # NÃO publica portas — interno apenas.

networks:
  control:
    name: sandcastle-control
    driver: bridge
