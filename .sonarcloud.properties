# SonarCloud AUTOMATIC ANALYSIS config — lido pelo AutoScan (análise
# web-side a cada push), que IGNORA os /d:sonar.exclusions do scanner
# no CI (ci.yml) e o sonar-project.properties. Exclusões espelham a
# lista canônica: vendor/generated/doc-artifacts não são código de
# produção e geram ruído não corrigível (848x javascript:S7761 +
# ~150 JS/css/Web em docs/architecture/*.html, monaco/xterm vendored).
sonar.exclusions=\
  docs/**,\
  **/wwwroot/lib/**,\
  **/wwwroot/css/app.css,\
  **/wwwroot/js/theme.js,\
  **/wwwroot/js/monacoInterop.js,\
  **/wwwroot/index.html,\
  **/Persistence/Migrations/**,\
  **/bin/**,\
  **/obj/**,\
  **/packages.lock.json,\
  **/Golden/**,\
  **/data/**

# Won't-fix justificados (decisão de design já documentada inline):
# docker:S7031 — RUNs separados por propósito preservam cache de camada
#   e legibilidade (apt-base, gh cli, node, ttyd, usuário).
# docker:S7026 — curl+sha256sum verifica o script antes de executar;
#   ADD deixaria camada não-verificada no cache.
# css:S9423 — !important no bloco prefers-reduced-motion é o padrão WCAG;
#   sem ele a garantia de a11y perde para regras de especificidade do tema.
sonar.issue.ignore.multicriteria=1,2,3
sonar.issue.ignore.multicriteria.1.ruleKey=docker:S7031
sonar.issue.ignore.multicriteria.1.resourceKey=runtime/Dockerfile
sonar.issue.ignore.multicriteria.2.ruleKey=docker:S7026
sonar.issue.ignore.multicriteria.2.resourceKey=runtime/Dockerfile
sonar.issue.ignore.multicriteria.3.ruleKey=css:S9423
sonar.issue.ignore.multicriteria.3.resourceKey=src/OpenHandsNET.Client/Styles/app.tailwind.css
