# SPEC-37/49: Api Deployment + Service — hosta o WASM + REST + SignalR.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhandsnet-api
  labels:
    app.kubernetes.io/name: openhandsnet
    app.kubernetes.io/component: api
spec:
  replicas: {{ .Values.deployment.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: openhandsnet
      app.kubernetes.io/component: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openhandsnet
        app.kubernetes.io/component: api
    spec:
      {{- if eq .Values.sandbox.provider "kubernetes" }}
      serviceAccountName: openhandsnet-runtime
      {{- end }}
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          {{- if .Values.secrets.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.secrets.existingSecret }}
          {{- end }}
          env:
            - name: OPENHANDSNET_Sandbox__Provider
              value: "{{ .Values.sandbox.provider }}"
            - name: OPENHANDSNET_Cache__Provider
              value: "{{ .Values.cache.provider }}"
            - name: OPENHANDSNET_Deployment__Replicas
              value: "{{ .Values.deployment.replicas }}"
            - name: OPENHANDSNET_RuntimeApi__BaseUrl
              value: "http://openhandsnet-runtime-api:8090"
            {{- if eq .Values.sandbox.provider "kubernetes" }}
            - name: OPENHANDSNET_Sandbox__Kubernetes__Namespace
              value: "{{ .Values.sandbox.namespace }}"
            - name: OPENHANDSNET_Sandbox__Kubernetes__RuntimeClassName
              value: "{{ .Values.sandbox.runtimeClassName }}"
            - name: OPENHANDSNET_Sandbox__Kubernetes__WorkspaceStorageClass
              value: "{{ .Values.sandbox.workspaceStorageClass }}"
            - name: OPENHANDSNET_Sandbox__Kubernetes__WorkspacePvcSize
              value: "{{ .Values.sandbox.workspacePvcSize }}"
            - name: OPENHANDSNET_Sandbox__Kubernetes__WarmPoolImages
              value: "{{ .Values.sandbox.warmPoolImages }}"
            {{- end }}
            {{- if eq .Values.cache.provider "redis" }}
            - name: OPENHANDSNET_Cache__Redis__ConnectionString
              value: "openhandsnet-valkey:6379"
            {{- end }}
            {{- if and .Values.postgres.enabled .Values.postgres.externalSecretName }}
            # Produção: DSN via secretKeyRef — nunca em values/planejado.
            - name: OPENHANDSNET_ConnectionStrings__Default
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.externalSecretName }}
                  key: {{ .Values.postgres.externalSecretKey }}
            {{- else if and .Values.postgres.enabled .Values.postgres.dev.enabled }}
            - name: OPENHANDSNET_ConnectionStrings__Default
              value: "Host=openhandsnet-postgres;Database=openhandsnet;Username=openhandsnet;Password={{ .Values.postgres.dev.password }}"
            {{- end }}
            {{- if .Values.apiEnv }}
            {{- range .Values.apiEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /api/v1/readiness
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.api | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: openhandsnet-api
spec:
  selector:
    app.kubernetes.io/name: openhandsnet
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 8080
      targetPort: http
