# SPEC-35/37/49: Runtime-Api Deployment + Service — modo split
# (provider=remote): orquestra Docker remoto; em provider=kubernetes o
# Api já fala com o apiserver direto — runtimeApi.enabled=false default.
{{- if .Values.runtimeApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openhandsnet-runtime-api
  labels:
    app.kubernetes.io/name: openhandsnet
    app.kubernetes.io/component: runtime-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: openhandsnet
      app.kubernetes.io/component: runtime-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openhandsnet
        app.kubernetes.io/component: runtime-api
    spec:
      serviceAccountName: openhandsnet-runtime
      containers:
        - name: runtime-api
          image: "{{ .Values.runtimeApi.repository }}:{{ .Values.runtimeApi.tag }}"
          ports:
            - name: http
              containerPort: 8090
          env:
            - name: OPENHANDSNET_Sandbox__Provider
              value: "{{ .Values.sandbox.provider }}"
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources.runtimeApi | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: openhandsnet-runtime-api
spec:
  selector:
    app.kubernetes.io/name: openhandsnet
    app.kubernetes.io/component: runtime-api
  ports:
    - name: http
      port: 8090
      targetPort: http
{{- end }}
