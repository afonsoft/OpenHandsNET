# SPEC-37 + SPEC-49 RBAC mínimo: pods/pvc/exec/configmaps no namespace
# de sandboxes apenas — o Api (provider=kubernetes) orquestra os pods
# in-cluster com esta ServiceAccount; o runtime-api (provider=remote)
# usa a mesma conta quando habilitado.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: openhandsnet-runtime
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: openhandsnet-sandbox-manager
  namespace: {{ .Values.sandbox.namespace }}
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/status", "pods/exec", "persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
  # SPEC-49 RF-002: sleep snapshots (pod.json por sandbox).
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "delete", "update", "patch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "delete", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: openhandsnet-sandbox-manager
  namespace: {{ .Values.sandbox.namespace }}
subjects:
  - kind: ServiceAccount
    name: openhandsnet-runtime
    namespace: {{ .Release.Namespace }}
roleRef:
  kind: Role
  name: openhandsnet-sandbox-manager
  apiGroup: rbac.authorization.k8s.io
