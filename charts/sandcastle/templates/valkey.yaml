# SPEC-36/37/49: Valkey (Redis-compat) — só quando cache.provider=redis
# (obrigatório com deployment.replicas > 1: backplane + rate limit global).
{{- if eq .Values.cache.provider "redis" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: sandcastle-valkey
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sandcastle
      app.kubernetes.io/component: valkey
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sandcastle
        app.kubernetes.io/component: valkey
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8-alpine
          ports:
            - containerPort: 6379
          readinessProbe:
            exec:
              command: ["valkey-cli", "ping"]
            periodSeconds: 5
          resources:
            {{- toYaml .Values.resources.valkey | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: sandcastle-valkey
spec:
  selector:
    app.kubernetes.io/name: sandcastle
    app.kubernetes.io/component: valkey
  ports:
    - port: 6379
{{- end }}
